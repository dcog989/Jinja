name: Release

on:
  push:
    tags: [v*]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches extension version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' extension.toml)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match extension.toml version v$version"
            exit 1
          fi

      # The tag points at the bump commit, so CHANGELOG.md already contains the
      # matching `## vX.Y.Z` section generated by cog.
      - name: Extract release notes
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## " tag " ") == 1 { found = 1; print; next }
            found && (/^- - -$/ || /^## /) { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          props=(--title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md)
          case "${GITHUB_REF_NAME}" in *-*) props+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" "${props[@]}"
