#:schema https://docs.cocogitto.io/cog-schema.json

branch_whitelist = ["main"]
from_latest_tag = true
ignore_merge_commits = true
tag_prefix = "v"

# `{{version}}` is replaced by cog before the hooks run, so the manifest is
# already bumped when the bump commit is created.
pre_bump_hooks = [
  "just check",
  "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' extension.toml",
]

post_bump_hooks = [
  "git push",
  "git push origin {{version_tag}}",
]

[changelog]
path = "CHANGELOG.md"

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""
